# Public CI (docs, CONTRIBUTING.md): the same checks as before every push. No secrets: every check
# is pure, and the build needs no settings.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run schemas
      - run: npm run check
      - run: npm run check:all
      - run: npm run build
